name: Deploy (Frontend → Vercel · Backend → GHCR)

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'shared/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: deploy-pixelforge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────
  # Job 1 · Deploy Next.js frontend → Vercel
  # ──────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy frontend/ → Vercel
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    environment:
      name: production
      url: ${{ steps.vercel-deploy.outputs.url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ./frontend/pnpm-lock.yaml

      - name: Install Vercel CLI globally
        run: pnpm add -g vercel@latest

      - name: Pull env + build + deploy (Vercel Production)
        id: vercel-deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID_FRONTEND: ${{ secrets.VERCEL_PROJECT_ID_FRONTEND }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID_FRONTEND" ]; then
            echo "::notice::Vercel frontend secrets missing. Skipping auto-deploy."
            echo "::notice::Setup:"
            echo "  1. cd frontend && vercel link → write down ORG_ID + PROJECT_ID"
            echo "  2. Create token: https://vercel.com/account/tokens"
            echo "  3. Repo → Settings → Secrets → Add: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID_FRONTEND"
            echo "  4. Vercel Project → Env Vars: NEXT_PUBLIC_API_BASE_URL (your backend URL, e.g. https://api.pixelforge.io)"
            exit 0
          fi
          export VERCEL_PROJECT_ID="$VERCEL_PROJECT_ID_FRONTEND"
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "✅ Frontend deployed to: $DEPLOY_URL"

  # ──────────────────────────────────────────────────────────
  # Job 2 · Build & push backend Docker image → GitHub Container Registry (GHCR)
  # ──────────────────────────────────────────────────────────
  push-backend-image:
    name: Build & push backend/ → GHCR
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch build support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags / labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pixelforge-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}},prefix=v

      - name: Build multi-arch image & push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Post-deploy instructions for backend
        run: |
          echo ""
          echo "🐳 Backend Docker image pushed to:"
          echo "   ghcr.io/${{ github.repository_owner }}/pixelforge-backend:latest"
          echo ""
          echo "📋 Next steps — pull & run on your server (RunPod / any VPS):"
          echo ""
          echo "   docker login ghcr.io -u ${{ github.repository_owner }} -p <GH_PERSONAL_ACCESS_TOKEN_packages_read>"
          echo "   docker pull ghcr.io/${{ github.repository_owner }}/pixelforge-backend:latest"
          echo ""
          echo "   # Orchestrate with the rest of the stack (Postgres + Redis + Worker + Beat + Flower):"
          echo "   # → Use the repo-root docker-compose.yml as a template on your server."
          echo ""
          echo "🔑 Secrets that must be injected at runtime (env-file or managed Postgres/Redis):"
          echo "   DATABASE_URL           → Managed Postgres (Supabase / Neon / AWS RDS)"
          echo "   CELERY_BROKER_URL      → Managed Redis (Upstash / AWS ElastiCache)"
          echo "   CELERY_RESULT_BACKEND  → Same Redis, db=1"
          echo "   RUNPOD_API_KEY + RUNPOD_ENDPOINT_ID"
          echo "   R2_ACCOUNT_ID / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_BUCKET / R2_PUBLIC_URL"
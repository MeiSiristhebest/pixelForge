version: "3.9"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: pixelforge-postgres
    environment:
      POSTGRES_USER: pixelforge
      POSTGRES_PASSWORD: pixelforgepass
      POSTGRES_DB: pixelforge
    ports:
      - "5432:5432"  # 使用原端口5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixelforge"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Celery broker
  redis:
    image: redis:7-alpine
    container_name: pixelforge-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI API Server
  api:
    image: nefelibata0531/pixelforge-api:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pixelforge-api
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Celery Worker
  worker:
    image: nefelibata0531/pixelforge-api:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pixelforge-worker
    command: uv run celery -A app.celery_app.app worker --loglevel=info --concurrency=4 -Q generation,celery
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Celery Beat (Periodic Tasks)
  beat:
    image: nefelibata0531/pixelforge-api:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pixelforge-beat
    command: uv run celery -A app.celery_app.app beat --loglevel=info
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Celery Flower (Task Monitor)
  flower:
    image: nefelibata0531/pixelforge-api:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pixelforge-flower
    command: uv run celery -A app.celery_app.app flower --port=5555
    ports:
      - "5555:5555"
    env_file:
      - ./backend/.env
    depends_on:
      - worker

  # Next.js Frontend
  frontend:
    image: nefelibata0531/pixelforge-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pixelforge-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
      - NEXT_PUBLIC_WS_URL=ws://api:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
